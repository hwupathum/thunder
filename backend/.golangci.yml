version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gocritic:
      disabled-checks:
        - exitAfterDefer
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    revive:
      rules:
        - name: struct-tag
          arguments:
            - json,inline
        - name: var-naming
        - name: redundant-import-alias
        - name: comment-spacings
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
  exclusions:
    generated: lax
    paths:
      - tests/mocks
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/thunder-id/thunderid)
    goimports:
      local-prefixes:
        - github.com/thunder-id/thunderid
  exclusions:
    generated: lax
    paths:
      - tests/mocks
      - third_party$
      - builtin$
      - examples$
output:
  show-stats: true
